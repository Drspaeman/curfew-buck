<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hunter Sub Map Editor</title>
<style>
  :root { --bg: #0b0f14; --panel: #151b23; --line: #2a3440; --text: #e8e8e8; --dim: #9aa4ae; --accent: #ff7a1a; --ok: #9be564; --bad: #ff6b6b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0 12px 0 0; color: var(--accent); }
  button, select, input { font: inherit; color: var(--text); background: #222b36; border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; }
  button:hover { background: #2c3846; }
  button.on { background: var(--accent); color: #111; border-color: var(--accent); }
  button.play { background: var(--ok); color: #111; font-weight: 700; }
  main { flex: 1; display: flex; min-height: 0; }
  #tools { width: 190px; padding: 10px; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
  #tools label { color: var(--dim); font-size: 12px; margin-top: 6px; }
  #tools input { width: 100%; }
  #wrap { flex: 1; position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
  #status { padding: 6px 12px; background: var(--panel); border-top: 1px solid var(--line); color: var(--dim); min-height: 30px; }
  #status .bad { color: var(--bad); } #status .ok { color: var(--ok); }
  @media (max-width: 700px) { main { flex-direction: column; } #tools { width: auto; flex-direction: row; flex-wrap: wrap; max-height: 150px; } }
</style>
</head>
<body>
<header>
  <h1>🦌 Hunter Sub Map Editor</h1>
  <button id="new">New</button>
  <button id="sample">Load sample</button>
  <button id="import">Import .json</button>
  <button id="export">Export .json</button>
  <button id="undo">Undo</button>
  <button id="play" class="play">▶ Play this map</button>
</header>
<main>
  <div id="tools"></div>
  <div id="wrap"><canvas id="cv"></canvas></div>
</main>
<div id="status">Pick a tool, then click or drag on the map.</div>
<script src="editor.js"></script>
</body>
</html>
